<!DOCTYPE html>
<html>
<head>
    <title>AI Discord Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f13; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 600px; background: #1a1a20; border-radius: 12px; border: 1px solid #2a2a35; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; align-items: center; margin-bottom: 20px; font-weight: bold; font-size: 18px; }
        .chat-box { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .message { background: #2a2a35; padding: 12px 16px; border-radius: 8px; width: fit-content; max-width: 80%; }
        .user-message { background: #5865F2; align-self: flex-end; }
        .bot-message { align-self: flex-start; }
        .steps { font-size: 14px; color: #a3a3b3; margin-top: 5px; }
        .input-area { display: flex; gap: 10px; }
        input, select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2a2a35; background: #0f0f13; color: white; outline: none; }
        button { background: #5865F2; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4752C4; }
        .undo-btn { background: #2a2a35; margin-top: 10px; display: none; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">✨ AI Server Manager</div>
    <div style="margin-bottom: 10px;">
        <select id="guild_select">
            <option value="">Loading your servers...</option>
        </select>
    </div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-message">Select your server from the dropdown, then tell me what to do!</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="prompt" placeholder="Make me a steal a brainrot roblox server pls" onkeypress="handleKeyPress(event)">
        <button onclick="sendPrompt()">Send</button>
    </div>
    <button class="undo-btn" id="undo-btn" onclick="undoAction()">Undo Last Action</button>
</div>

<script>
    // Load the servers into the dropdown when the page opens
    window.onload = async function() {
        try {
            const res = await fetch('/api/guilds');
            const data = await res.json();
            const select = document.getElementById('guild_select');
            
            if (data.guilds && data.guilds.length > 0) {
                select.innerHTML = '';
                data.guilds.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.innerText = g.name;
                    select.appendChild(opt);
                });
            } else {
                select.innerHTML = '<option value="">Bot is not in any servers!</option>';
            }
        } catch(e) {
            document.getElementById('guild_select').innerHTML = '<option value="">Error loading servers. Refresh.</option>';
        }
    };

    async function sendPrompt() {
        const guildId = document.getElementById('guild_select').value;
        const promptInput = document.getElementById('prompt');
        const prompt = promptInput.value;
        
        if (!guildId) { alert("Select a server first!"); return; }
        if (!prompt) return;

        addMessage(prompt, 'user-message');
        promptInput.value = '';

        try {
            const response = await fetch(`/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guild_id: parseInt(guildId), prompt: prompt })
            });
            const data = await response.json();

            if (data.error) {
                addMessage(`Error: ${data.error}`, 'bot-message');
            } else if (data.steps && data.steps.length > 0) {
                const stepsHTML = data.steps.map(s => `✓ ${s}`).join('<br>');
                addMessage(`<b>Steps done:</b><div class="steps">${stepsHTML}</div>`, 'bot-message');
                document.getElementById('undo-btn').style.display = 'block';
            } else {
                addMessage(`AI didn't make any changes. Output:<br><code>${data.raw}</code>`, 'bot-message');
            }
        } catch (e) {
            addMessage("Failed to connect. The bot might still be starting up on Railway.", 'bot-message');
        }
    }

    async function undoAction() {
        const guildId = document.getElementById('guild_select').value;
        const response = await fetch(`/api/undo`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guild_id: parseInt(guildId), prompt: "" })
        });
        const data = await response.json();
        addMessage(data.success || data.error, 'bot-message');
        document.getElementById('undo-btn').style.display = 'none';
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById('chat-box');
        const msg = document.createElement('div');
        msg.className = `message ${className}`;
        msg.innerHTML = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendPrompt();
    }
</script>
</body>
</html>
