<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rynnzyr — AI Discord Architect</title>
  <style>
    :root { --bg:#090a0f; --panel:#12141b; --panel2:#191c25; --text:#f7f8ff; --muted:#9da3b4; --brand:#7c83ff; --brand2:#a78bfa; --green:#57e39a; --border:#292c38; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at 15% 0%,#20245a 0,transparent 28%),var(--bg); color:var(--text); }
    .shell { max-width:1180px; height:100vh; margin:auto; display:flex; flex-direction:column; padding:18px; }
    .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); background:rgba(18,20,27,.88); backdrop-filter:blur(18px); border-radius:18px; padding:0 18px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.3px; }
    .logo { width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 30px #7c83ff55; }
    .login,.icon-btn,.primary { border:0;border-radius:10px;color:white;background:var(--brand);font-weight:750;padding:11px 16px;text-decoration:none;cursor:pointer; }
    .workspace { min-height:0; flex:1; display:grid; grid-template-columns:310px 1fr; gap:16px; margin-top:16px; }
    .sidebar,.architect { border:1px solid var(--border); background:rgba(18,20,27,.94); border-radius:18px; min-height:0; }
    .sidebar { padding:14px; overflow:auto; }
    .sidebar h3 { margin:8px 8px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted); }
    .guild { display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;background:transparent;color:white;border-radius:12px;padding:9px;margin:3px 0;text-align:left;cursor:pointer; }
    .guild:hover,.guild.active { background:var(--panel2);border-color:var(--border); }
    .guild-icon { width:44px;height:44px;border-radius:50%;object-fit:cover;background:#30344a;display:grid;place-items:center;font-weight:800;flex:none;background-size:cover; }
    .guild-name { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;flex:1; }
    .invite { color:var(--green);font-size:12px;font-weight:800;text-decoration:none; }
    .architect { display:flex;flex-direction:column;overflow:hidden; }
    .chat { flex:1;overflow:auto;padding:24px; }
    .message { max-width:78%; padding:13px 15px;border-radius:14px;line-height:1.5;margin:8px 0; }
    .assistant { background:var(--panel2);border:1px solid var(--border); }
    .user { margin-left:auto;background:linear-gradient(135deg,#626aee,#8065dc); }
    .plan { margin-top:12px;display:grid;gap:8px; }
    .plan-card { padding:10px 12px;border-radius:10px;background:#101219;border:1px solid var(--border); }
    .composer { display:flex;gap:10px;padding:14px;border-top:1px solid var(--border); }
    input { flex:1;border:1px solid var(--border);border-radius:12px;background:#0d0f15;color:white;padding:14px 16px;outline:none;font-size:15px; }
    input:focus { border-color:var(--brand);box-shadow:0 0 0 3px #7c83ff22; }
    .actions { display:flex;gap:8px;padding:0 14px 14px; }
    .actions button { padding:10px 14px;border-radius:10px;border:1px solid var(--border);color:white;background:var(--panel2);cursor:pointer;font-weight:750; }
    .actions .apply { border:0;background:var(--green);color:#09110d; }
    .empty { height:100%;display:grid;place-items:center;text-align:center;color:var(--muted); }
    .empty strong { display:block;color:white;font-size:20px;margin-bottom:6px; }
    code { color:#bfc4ff; }
    @media(max-width:800px){ .workspace{grid-template-columns:1fr}.sidebar{display:none}.shell{padding:8px}.chat{padding:14px}.message{max-width:92%} }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="logo">R</div><div>Rynnzyr <span style="color:var(--muted);font-weight:600">AI Architect</span></div></div>
    <a class="login" id="login" href="/login">Login with Discord</a>
  </header>
  <main class="workspace">
    <aside class="sidebar"><h3>Your servers</h3><div id="guilds"></div></aside>
    <section class="architect">
      <div class="chat" id="chat">
        <div class="empty"><div><strong>Design a server with one message</strong>Log in and choose a server to begin.</div></div>
      </div>
      <div class="actions" id="actions" style="display:none"><button onclick="undo()">Undo last changes</button><button class="apply" onclick="applyPlan()">Apply server design</button></div>
      <div class="composer"><input id="prompt" maxlength="1000" placeholder="Example: Make a professional esports community with 8 teams and a tournament system"><button class="primary" onclick="sendPrompt()">Design</button></div>
    </section>
  </main>
</div>
<script>
let guildId=null, currentPlan=null;
window.onload=loadGuilds;
async function loadGuilds(){
  const res=await fetch('/api/user-guilds');
  if(res.status===401)return;
  const data=await res.json();
  if(data.error){document.getElementById('guilds').innerHTML=`<p style="color:#aaa">${data.error}</p>`;return}
  document.getElementById('login').style.display='none';
  const box=document.getElementById('guilds');box.innerHTML='';
  data.guilds.forEach(g=>{
    const el=document.createElement(g.has_bot?'button':'a');el.className=g.has_bot?'guild':'';
    if(g.has_bot){el.onclick=()=>openGuild(g)}else{el.href=g.invite_url;el.target='_blank';el.className='guild'}
    el.innerHTML=`<div class="guild-icon" ${g.icon?`style="background-image:url('https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png')"`:''}>${g.icon?'':g.name[0]}</div><div class="guild-name">${escapeHtml(g.name)}</div>${g.has_bot?'': '<span class="invite">Invite</span>'}`;
    box.appendChild(el);
  });
}
function openGuild(g){guildId=g.id;document.querySelectorAll('.guild').forEach(x=>x.classList.remove('active'));event.currentTarget?.classList.add('active');document.getElementById('chat').innerHTML=`<div class="message assistant">Connected to <b>${escapeHtml(g.name)}</b>. Describe the server you want.</div>`}
async function sendPrompt(){
  if(!guildId)return alert('Choose a server first');
  const input=document.getElementById('prompt');const prompt=input.value.trim();if(prompt.length<3)return;
  add(prompt,'user');input.value='';
  const loading=add('Designing the perfect layout…','assistant');
  try{const res=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guild_id:guildId,prompt})});const data=await res.json();loading.remove();if(data.detail)return add(`Error: ${data.detail}`,'assistant');currentPlan=data.plan;renderPlan(data.plan)}catch(e){loading.remove();add('Could not reach Rynnzyr.','assistant')}
}
function renderPlan(p){
  let html=`<div><b>${escapeHtml(p.summary)}</b><div class="plan">`;
  p.roles?.forEach(r=>html+=`<div class="plan-card">Role — <b>${escapeHtml(r.name)}</b></div>`);
  p.categories?.forEach(c=>{html+=`<div class="plan-card"><b>${escapeHtml(c.name)}</b><br>`;c.channels.forEach(ch=>html+=`<span style="color:var(--muted)">${ch.type==='voice?'#⸭':'#'}</span> ${escapeHtml(ch.name)}<br>`);html+='</div>'});
  html+='</div></div>';addHtml(html,'assistant');document.getElementById('actions').style.display='flex';
}
async function applyPlan(){if(!guildId||!currentPlan)return;const box=add('Creating roles, categories, and channels…','assistant');try{const res=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guild_id:guildId,plan:currentPlan})});const data=await res.json();box.remove();addHtml(data.success?`<b>Server updated.</b><br>${data.created.map(escapeHtml).join('<br>')}`:`Error: ${escapeHtml(data.detail||'Could not apply')}`,'assistant');}catch(e){box.remove();add('Failed to apply changes.','assistant')}}
async function undo(){if(!guildId)return;const res=await fetch('/api/undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guild_id:guildId})});const data=await res.json();add(data.success?`Undid ${data.deleted} created items.`:data.error,'assistant')}
function add(text,cls){const el=document.createElement('div');el.className=`message ${cls}`;el.textContent=text;document.getElementById('chat').appendChild(el);el.scrollIntoView({block:'end'});return el}
function addHtml(html,cls){const el=document.createElement('div');el.className=`message ${cls}`;el.innerHTML=html;document.getElementById('chat').appendChild(el);el.scrollIntoView({block:'end'});return el}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
</script>
</body>
</html>
